  <script>
    // The old site (before 2026) had separate pages. Send those old links to the
    // matching spot on the new single page. Left side: old path. Right side: section/paper id.
    var OLD_LINKS = {
      '/about': '',
      '/research': 'research',
      '/policy': 'policy',

      '/resume': 'cv',

      '/research/2024-LMCrimeReview-paper': 'income-crime',
      '/research/2024-UsualSuspects-paper-9': 'usual-suspects'

    if (path in OLD_LINKS) {
      location.replace('/' + (OLD_LINKS[path] ? '#' + OLD_LINKS[path] : ''));
    }
